name: Apply profile clone UI

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-clone-ui:
    if: >-
      github.event.pull_request.number == 31 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/0.3.6-host-key-verification'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 1

      - name: Apply exact source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Expected source block not found in {path}")
              file.write_text(text.replace(old, new, 1))

          profiles = "app/src/main/java/eu/blackserv/clientssh/ui/screens/ProfilesScreen.kt"
          replace(profiles, "import androidx.compose.ui.platform.LocalClipboardManager\n", "")
          replace(profiles, "import androidx.compose.ui.text.AnnotatedString\n", "")
          replace(
              profiles,
              "                        onEdit = onEdit,\n                        onConnect = onConnect,",
              "                        onEdit = onEdit,\n                        onClone = onClone,\n                        onConnect = onConnect,",
          )
          replace(
              profiles,
              "    onEdit: (HostProfile) -> Unit, onConnect: (HostProfile) -> Unit,\n    onDisconnect: () -> Unit, onSftp: (HostProfile) -> Unit,",
              "    onEdit: (HostProfile) -> Unit, onClone: (HostProfile) -> Unit,\n    onConnect: (HostProfile) -> Unit, onDisconnect: () -> Unit,\n    onSftp: (HostProfile) -> Unit,",
          )
          replace(profiles, "    val clipboard = LocalClipboardManager.current\n", "")
          replace(
              profiles,
              "                    IconButton(onClick = { clipboard.setText(AnnotatedString(address)) }, modifier = Modifier.size(34.dp)) {\n                        Icon(Icons.Default.ContentCopy, \"Kopiuj adres\", modifier = Modifier.size(18.dp), tint = if (neon) Color(0xFF9CB2AA) else MaterialTheme.colorScheme.onSurfaceVariant)\n                    }",
              "                    IconButton(onClick = { onClone(profile) }, modifier = Modifier.size(34.dp)) {\n                        Icon(Icons.Default.FileCopy, \"Klonuj profil\", modifier = Modifier.size(18.dp), tint = if (neon) Color(0xFF9CB2AA) else MaterialTheme.colorScheme.onSurfaceVariant)\n                    }",
          )

          main = "app/src/main/java/eu/blackserv/clientssh/MainActivity.kt"
          replace(
              main,
              "import eu.blackserv.clientssh.model.HostProfile\n",
              "import eu.blackserv.clientssh.model.HostProfile\nimport eu.blackserv.clientssh.model.cloneHostProfile\n",
          )
          replace(
              main,
              "    fun saveProfiles() = appStore.saveProfiles(profiles)\n    fun saveFavorites() = appStore.saveFavorites(favorites)",
              "    fun saveProfiles() = appStore.saveProfiles(profiles)\n    fun cloneProfile(source: HostProfile) {\n        val clone = cloneHostProfile(source, profiles.map { it.name })\n        val sourceIndex = profiles.indexOfFirst { it.id == source.id }\n        if (sourceIndex >= 0) profiles.add(sourceIndex + 1, clone) else profiles.add(clone)\n        saveProfiles()\n    }\n    fun saveFavorites() = appStore.saveFavorites(favorites)",
          )
          replace(main, "                onClone = {},", "                onClone = ::cloneProfile,")
          replace(
              main,
              "            onClone = { clone ->\n                profiles.add(clone)\n                saveProfiles()\n                editedProfile = clone\n                showProfileEditor = false\n            },",
              "            onClone = { source ->\n                cloneProfile(source)\n                showProfileEditor = false\n            },",
          )

          editor = "app/src/main/java/eu/blackserv/clientssh/ui/screens/ProfileEditorDialog.kt"
          replace(
              editor,
              "                        onClick = {\n                            buildProfile(\n                                id = UUID.randomUUID().toString(),\n                            )?.let { clone ->\n                                onClone(clone.copy(name = \"${clone.name} kopia\"))\n                            }\n                        },",
              "                        onClick = { buildProfile()?.let(onClone) },",
          )
          PY

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Source already updated."
            exit 0
          fi
          git config user.name "blackserv-automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            app/src/main/java/eu/blackserv/clientssh/MainActivity.kt \
            app/src/main/java/eu/blackserv/clientssh/ui/screens/ProfilesScreen.kt \
            app/src/main/java/eu/blackserv/clientssh/ui/screens/ProfileEditorDialog.kt
          git commit -m "Replace hostname copy with profile clone"
          git push origin HEAD:${GITHUB_HEAD_REF}
