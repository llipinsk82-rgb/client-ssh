name: Android build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/0.3.7-premium-visual-skin'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact premium branch
        uses: actions/checkout@v4
        with:
          ref: agent/0.3.7-premium-visual-skin
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare normal merge with current v47 base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/0.3.6-host-key-verification agent/0.3.7-premium-visual-skin
          if git merge-base --is-ancestor origin/agent/0.3.6-host-key-verification HEAD; then
            echo 'Current v47 base is already present.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git merge --no-ff --no-commit origin/agent/0.3.6-host-key-verification
          fi
          git status --short

      - name: Reject committed signing secrets
        shell: bash
        run: bash scripts/check-no-release-secrets.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run unit tests on premium plus v47
        shell: bash
        run: gradle :app:testDebugUnitTest --stacktrace --console=plain

      - name: Build premium v47 debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --console=plain
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Verify premium v47 APK metadata
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          BADGING="$($AAPT dump badging "$APK" | head -n 1)"
          ACTUAL_PACKAGE="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          ACTUAL_VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.* versionCode='\([^']*\)'.*/\1/p")"
          ACTUAL_VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.* versionName='\([^']*\)'.*/\1/p")"
          test "$ACTUAL_PACKAGE" = 'eu.blackserv.clientssh'
          test "$ACTUAL_VERSION_CODE" = '47'
          test "$ACTUAL_VERSION_NAME" = '0.3.6'

      - name: Upload premium v47 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: client-ssh-premium-v47-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Commit validated merge and restore standard CI
        shell: bash
        run: |
          set -euo pipefail
          BASE_BRANCH='agent/0.3.6-host-key-verification'
          PREMIUM_BRANCH='agent/0.3.7-premium-visual-skin'
          git show "origin/${BASE_BRANCH}:.github/workflows/android.yml" > .github/workflows/android.yml
          chmod 644 .github/workflows/android.yml
          git add .github/workflows/android.yml
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m 'Merge v47 full log into premium visual skin'
          else
            git commit -m 'Restore standard CI after premium v47 validation'
          fi
          git push origin HEAD:"${PREMIUM_BRANCH}"
