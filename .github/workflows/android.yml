name: Android build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_SIGNING_ENABLED: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reject committed signing secrets
        shell: bash
        run: bash scripts/check-no-release-secrets.sh
      - name: Validate release signing helper
        shell: bash
        run: |
          bash -n scripts/prepare-release-signing.sh
          bash -n scripts/test-prepare-release-signing.sh
          bash scripts/prepare-release-signing.sh --help >/dev/null
          bash scripts/test-prepare-release-signing.sh
      - name: Test Health Monitor report validator
        shell: bash
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          cat > "$TMP_DIR/pass.txt" <<'REPORT'
          Client SSH 0.3.5 — Health Monitor
          profile=1a2b3c4d
          enabled=true
          worker=SUCCESS
          worker_started=przed chwilą
          worker_finished=przed chwilą
          worker_detail=Pomiar zakończony
          status=ONLINE
          last_check=przed chwilą
          last_success=przed chwilą
          failures=0
          history_records=1
          REPORT
          bash scripts/verify-health-monitor-report.sh "$TMP_DIR/pass.txt"

          sed 's/^worker=SUCCESS$/worker=RETRY/' "$TMP_DIR/pass.txt" > "$TMP_DIR/retry.txt"
          if bash scripts/verify-health-monitor-report.sh "$TMP_DIR/retry.txt"; then
            echo "Validator accepted worker=RETRY" >&2
            exit 1
          fi

          cp "$TMP_DIR/pass.txt" "$TMP_DIR/secret.txt"
          echo 'password=should-never-appear' >> "$TMP_DIR/secret.txt"
          if bash scripts/verify-health-monitor-report.sh "$TMP_DIR/secret.txt"; then
            echo "Validator accepted a sensitive field" >&2
            exit 1
          fi
      - name: Validate release tag matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$TAG_VERSION"
          test -n "$APP_VERSION"
          test "$TAG_VERSION" = "$APP_VERSION"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          if ! gradle :app:testDebugUnitTest --stacktrace --console=plain > test.log 2>&1; then
            tail -n 250 test.log
            exit 1
          fi
          tail -n 80 test.log
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          if ! gradle :app:assembleDebug --stacktrace --console=plain > build-debug.log 2>&1; then
            tail -n 250 build-debug.log
            exit 1
          fi
          tail -n 80 build-debug.log
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Verify debug APK metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          EXPECTED_PACKAGE="eu.blackserv.clientssh"
          EXPECTED_VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)/\1/p' app/build.gradle.kts | head -n 1)"
          EXPECTED_VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)"
          BADGING="$($AAPT dump badging "$APK" | head -n 1)"
          ACTUAL_PACKAGE="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          ACTUAL_VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.* versionCode='\([^']*\)'.*/\1/p")"
          ACTUAL_VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.* versionName='\([^']*\)'.*/\1/p")"
          test "$ACTUAL_PACKAGE" = "$EXPECTED_PACKAGE"
          test "$ACTUAL_VERSION_CODE" = "$EXPECTED_VERSION_CODE"
          test "$ACTUAL_VERSION_NAME" = "$EXPECTED_VERSION_NAME"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: client-ssh-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Commit validated v47 source
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/0.3.6-host-key-verification'
        shell: bash
        env:
          TARGET_BRANCH: agent/0.3.6-host-key-verification
        run: |
          set -euo pipefail
          LOG_STORE="app/src/main/java/eu/blackserv/clientssh/terminal/TerminalSessionLogStore.kt"
          HARNESS="scripts/v47-patch-r2.tar.gz"
          if [[ ! -f "$LOG_STORE" || ! -f "$HARNESS" ]]; then
            echo "Clean v47 source already present or no harness to finalize."
            exit 0
          fi

          SOURCE_ARCHIVE="${RUNNER_TEMP}/v47-final-source.tar.gz"
          source_files=(
            "app/build.gradle.kts"
            "app/src/main/java/eu/blackserv/clientssh/MainActivity.kt"
            "app/src/main/java/eu/blackserv/clientssh/service/TerminalSessionService.kt"
            "app/src/main/java/eu/blackserv/clientssh/terminal/TerminalSessionBus.kt"
            "app/src/main/java/eu/blackserv/clientssh/terminal/TerminalSessionLogStore.kt"
            "app/src/main/java/eu/blackserv/clientssh/ui/screens/TerminalScreen.kt"
            "app/src/test/java/eu/blackserv/clientssh/terminal/TerminalSessionLogStoreTest.kt"
          )
          tar -czf "$SOURCE_ARCHIVE" "${source_files[@]}"

          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          tar -xzf "$SOURCE_ARCHIVE" -C .
          rm -f app/src/main/assets/v47-source.tar.gz
          rmdir app/src/main/assets 2>/dev/null || true
          rm -f scripts/v47-patch-r2.tar.gz
          git show f7a3ad6ab7ad7b4d7589c72e4dba1c469eff0038:scripts/check-no-release-secrets.sh > scripts/check-no-release-secrets.sh
          git show f7a3ad6ab7ad7b4d7589c72e4dba1c469eff0038:.github/workflows/android.yml > .github/workflows/android.yml
          chmod 644 scripts/check-no-release-secrets.sh .github/workflows/android.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${source_files[@]}" scripts/check-no-release-secrets.sh .github/workflows/android.yml
          git add -u scripts/v47-patch-r2.tar.gz
          git diff --cached --check
          git commit -m "Add full streaming terminal log v47 [v47-source-applied]"
          git push origin HEAD:"$TARGET_BRANCH"
      - name: Check release signing secrets
        if: env.RELEASE_SIGNING_ENABLED == 'true'
        shell: bash
        env:
          CLIENT_SSH_RELEASE_KEYSTORE_B64: ${{ secrets.CLIENT_SSH_RELEASE_KEYSTORE_B64 }}
          CLIENT_SSH_RELEASE_STORE_PASSWORD: ${{ secrets.CLIENT_SSH_RELEASE_STORE_PASSWORD }}
          CLIENT_SSH_RELEASE_KEY_ALIAS: ${{ secrets.CLIENT_SSH_RELEASE_KEY_ALIAS }}
          CLIENT_SSH_RELEASE_KEY_PASSWORD: ${{ secrets.CLIENT_SSH_RELEASE_KEY_PASSWORD }}
          CLIENT_SSH_RELEASE_CERT_SHA256: ${{ secrets.CLIENT_SSH_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$CLIENT_SSH_RELEASE_KEYSTORE_B64"
          test -n "$CLIENT_SSH_RELEASE_STORE_PASSWORD"
          test -n "$CLIENT_SSH_RELEASE_KEY_ALIAS"
          test -n "$CLIENT_SSH_RELEASE_KEY_PASSWORD"
          test -n "$CLIENT_SSH_RELEASE_CERT_SHA256"
      - name: Restore release signing key from secrets
        if: env.RELEASE_SIGNING_ENABLED == 'true'
        shell: bash
        env:
          CLIENT_SSH_RELEASE_KEYSTORE_B64: ${{ secrets.CLIENT_SSH_RELEASE_KEYSTORE_B64 }}
          CLIENT_SSH_RELEASE_STORE_PASSWORD: ${{ secrets.CLIENT_SSH_RELEASE_STORE_PASSWORD }}
          CLIENT_SSH_RELEASE_KEY_ALIAS: ${{ secrets.CLIENT_SSH_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p app/signing
          printf '%s' "$CLIENT_SSH_RELEASE_KEYSTORE_B64" | base64 --decode > app/signing/client-ssh-release.jks
          chmod 600 app/signing/client-ssh-release.jks
          STOREPASS_FILE="${RUNNER_TEMP}/client-ssh-release-storepass"
          printf '%s\n' "$CLIENT_SSH_RELEASE_STORE_PASSWORD" > "$STOREPASS_FILE"
          chmod 600 "$STOREPASS_FILE"
          keytool -list \
            -keystore app/signing/client-ssh-release.jks \
            -storepass:file "$STOREPASS_FILE" \
            -alias "$CLIENT_SSH_RELEASE_KEY_ALIAS" >/dev/null
      - name: Build signed release APK
        if: env.RELEASE_SIGNING_ENABLED == 'true'
        shell: bash
        env:
          CLIENT_SSH_RELEASE_STORE_PASSWORD: ${{ secrets.CLIENT_SSH_RELEASE_STORE_PASSWORD }}
          CLIENT_SSH_RELEASE_KEY_ALIAS: ${{ secrets.CLIENT_SSH_RELEASE_KEY_ALIAS }}
          CLIENT_SSH_RELEASE_KEY_PASSWORD: ${{ secrets.CLIENT_SSH_RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace --console=plain
      - name: Verify release APK metadata
        if: env.RELEASE_SIGNING_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          EXPECTED_PACKAGE="eu.blackserv.clientssh"
          EXPECTED_VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)/\1/p' app/build.gradle.kts | head -n 1)"
          EXPECTED_VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)"
          BADGING="$($AAPT dump badging "$APK" | head -n 1)"
          ACTUAL_PACKAGE="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          ACTUAL_VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.* versionCode='\([^']*\)'.*/\1/p")"
          ACTUAL_VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.* versionName='\([^']*\)'.*/\1/p")"
          test "$ACTUAL_PACKAGE" = "$EXPECTED_PACKAGE"
          test "$ACTUAL_VERSION_CODE" = "$EXPECTED_VERSION_CODE"
          test "$ACTUAL_VERSION_NAME" = "$EXPECTED_VERSION_NAME"
          cat > app/build/outputs/apk/release/APK_METADATA.txt <<EOF
          package=$ACTUAL_PACKAGE
          versionCode=$ACTUAL_VERSION_CODE
          versionName=$ACTUAL_VERSION_NAME
          EOF
      - name: Verify release certificate
        if: env.RELEASE_SIGNING_ENABLED == 'true'
        shell: bash
        env:
          CLIENT_SSH_RELEASE_CERT_SHA256: ${{ secrets.CLIENT_SSH_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          ACTUAL="$($APKSIGNER verify --verbose --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="$(printf '%s' "$CLIENT_SSH_RELEASE_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL" = "$EXPECTED"
          printf '%s\n' "$ACTUAL" > app/build/outputs/apk/release/CERTIFICATE_SHA256.txt
          sha256sum "$APK" | tee app/build/outputs/apk/release/SHA256SUMS.txt
      - name: Upload signed release APK
        if: env.RELEASE_SIGNING_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: client-ssh-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/APK_METADATA.txt
            app/build/outputs/apk/release/CERTIFICATE_SHA256.txt
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing key
        if: always()
        shell: bash
        run: |
          rm -f app/signing/client-ssh-release.jks
          rm -f "${RUNNER_TEMP}/client-ssh-release-storepass"
