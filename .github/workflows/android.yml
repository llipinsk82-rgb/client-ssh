name: Android build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/0.3.7-persistent-auto-wrap'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact persistent-wrap branch
        uses: actions/checkout@v4
        with:
          ref: agent/0.3.7-persistent-auto-wrap
          fetch-depth: 0
          persist-credentials: true

      - name: Apply persistent AUTO ZAWIJANIE v48
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/apply-persistent-auto-wrap-v48.py
          python3 scripts/apply-persistent-auto-wrap-v48.py .
          rm -rf scripts/__pycache__
          git diff --check
          grep -q 'AUTO ZAWIJANIE' app/src/main/java/eu/blackserv/clientssh/model/Models.kt
          grep -q 'TerminalWrapPreferences.load' app/src/main/java/eu/blackserv/clientssh/ui/screens/TerminalScreen.kt
          grep -q 'versionCode = 48' app/build.gradle.kts

      - name: Reject committed signing secrets
        shell: bash
        run: bash scripts/check-no-release-secrets.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run unit tests
        shell: bash
        run: gradle :app:testDebugUnitTest --stacktrace --console=plain

      - name: Build persistent-wrap v48 debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --console=plain
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Verify v48 APK metadata
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          BADGING="$($AAPT dump badging "$APK" | head -n 1)"
          ACTUAL_PACKAGE="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          ACTUAL_VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.* versionCode='\([^']*\)'.*/\1/p")"
          ACTUAL_VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.* versionName='\([^']*\)'.*/\1/p")"
          test "$ACTUAL_PACKAGE" = 'eu.blackserv.clientssh'
          test "$ACTUAL_VERSION_CODE" = '48'
          test "$ACTUAL_VERSION_NAME" = '0.3.6'

      - name: Upload persistent-wrap v48 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: client-ssh-auto-wrap-v48-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Commit validated persistent-wrap source and restore standard CI
        shell: bash
        run: |
          set -euo pipefail
          BASE_BRANCH='agent/0.3.7-premium-visual-skin'
          TARGET_BRANCH='agent/0.3.7-persistent-auto-wrap'
          git fetch origin "$BASE_BRANCH" "$TARGET_BRANCH"
          git show "origin/${BASE_BRANCH}:.github/workflows/android.yml" > .github/workflows/android.yml
          chmod 644 .github/workflows/android.yml
          rm -f scripts/apply-persistent-auto-wrap-v48.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/build.gradle.kts \
            app/src/main/java/eu/blackserv/clientssh/model/Models.kt \
            app/src/main/java/eu/blackserv/clientssh/ui/screens/TerminalScreen.kt \
            app/src/main/java/eu/blackserv/clientssh/terminal/TerminalWrapPreferences.kt \
            app/src/test/java/eu/blackserv/clientssh/terminal/TerminalWrapPreferencesTest.kt \
            .github/workflows/android.yml
          git add -u scripts/apply-persistent-auto-wrap-v48.py
          git diff --cached --check
          git commit -m 'Persist terminal AUTO ZAWIJANIE v48 [auto-wrap-applied]'
          git push origin HEAD:"${TARGET_BRANCH}"
