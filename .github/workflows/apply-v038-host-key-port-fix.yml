name: Apply v0.3.8 host-key port fix

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/v038-host-key-port-fix-trigger.txt"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply audited source patch
        run: python3 scripts/apply-v038-host-key-port-fix.py

      - name: Commit patched sources to PR branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app scripts docs
          if git diff --cached --quiet; then
            echo "Patch already applied."
            exit 0
          fi
          git commit -m "Fix SSH host-key identity for shared host ports"
          git push origin "HEAD:${HEAD_BRANCH}"
