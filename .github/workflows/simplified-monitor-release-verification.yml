name: Simplified monitor signed test

on:
  push:
    branches:
      - agent/0.3.6-host-key-verification
    paths:
      - .github/workflows/simplified-monitor-release-verification.yml

permissions:
  contents: read
  issues: write

jobs:
  signed-test:
    if: github.repository == 'llipinsk82-rgb/client-ssh' && github.actor == 'llipinsk82-rgb'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_VERSION_CODE: '43'
      EXPECTED_VERSION_NAME: '0.3.6'
      EXPECTED_PACKAGE: eu.blackserv.clientssh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify guarded source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/agent/0.3.6-host-key-verification"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)/\1/p' app/build.gradle.kts | head -n 1)" = "$EXPECTED_VERSION_CODE"
          test "$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)" = "$EXPECTED_VERSION_NAME"
          bash scripts/check-no-release-secrets.sh
          bash scripts/check-ssh-host-key-policy.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Check signing secrets
        shell: bash
        env:
          CLIENT_SSH_RELEASE_KEYSTORE_B64: ${{ secrets.CLIENT_SSH_RELEASE_KEYSTORE_B64 }}
          CLIENT_SSH_RELEASE_STORE_PASSWORD: ${{ secrets.CLIENT_SSH_RELEASE_STORE_PASSWORD }}
          CLIENT_SSH_RELEASE_KEY_ALIAS: ${{ secrets.CLIENT_SSH_RELEASE_KEY_ALIAS }}
          CLIENT_SSH_RELEASE_KEY_PASSWORD: ${{ secrets.CLIENT_SSH_RELEASE_KEY_PASSWORD }}
          CLIENT_SSH_RELEASE_CERT_SHA256: ${{ secrets.CLIENT_SSH_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$CLIENT_SSH_RELEASE_KEYSTORE_B64"
          test -n "$CLIENT_SSH_RELEASE_STORE_PASSWORD"
          test -n "$CLIENT_SSH_RELEASE_KEY_ALIAS"
          test -n "$CLIENT_SSH_RELEASE_KEY_PASSWORD"
          test -n "$CLIENT_SSH_RELEASE_CERT_SHA256"

      - name: Restore and verify signing key
        shell: bash
        env:
          CLIENT_SSH_RELEASE_KEYSTORE_B64: ${{ secrets.CLIENT_SSH_RELEASE_KEYSTORE_B64 }}
          CLIENT_SSH_RELEASE_STORE_PASSWORD: ${{ secrets.CLIENT_SSH_RELEASE_STORE_PASSWORD }}
          CLIENT_SSH_RELEASE_KEY_ALIAS: ${{ secrets.CLIENT_SSH_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p app/signing
          printf '%s' "$CLIENT_SSH_RELEASE_KEYSTORE_B64" | base64 --decode > app/signing/client-ssh-release.jks
          chmod 600 app/signing/client-ssh-release.jks
          STOREPASS_FILE="${RUNNER_TEMP}/client-ssh-release-storepass"
          printf '%s\n' "$CLIENT_SSH_RELEASE_STORE_PASSWORD" > "$STOREPASS_FILE"
          chmod 600 "$STOREPASS_FILE"
          keytool -list \
            -keystore app/signing/client-ssh-release.jks \
            -storepass:file "$STOREPASS_FILE" \
            -alias "$CLIENT_SSH_RELEASE_KEY_ALIAS" >/dev/null

      - name: Run unit tests
        shell: bash
        run: gradle :app:testDebugUnitTest --stacktrace --console=plain

      - name: Build signed release APK
        shell: bash
        env:
          CLIENT_SSH_RELEASE_STORE_PASSWORD: ${{ secrets.CLIENT_SSH_RELEASE_STORE_PASSWORD }}
          CLIENT_SSH_RELEASE_KEY_ALIAS: ${{ secrets.CLIENT_SSH_RELEASE_KEY_ALIAS }}
          CLIENT_SSH_RELEASE_KEY_PASSWORD: ${{ secrets.CLIENT_SSH_RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace --console=plain

      - name: Verify APK metadata and certificate
        shell: bash
        env:
          CLIENT_SSH_RELEASE_CERT_SHA256: ${{ secrets.CLIENT_SSH_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          BADGING="$($AAPT dump badging "$APK" | head -n 1)"
          ACTUAL_PACKAGE="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          ACTUAL_VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.* versionCode='\([^']*\)'.*/\1/p")"
          ACTUAL_VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.* versionName='\([^']*\)'.*/\1/p")"
          test "$ACTUAL_PACKAGE" = "$EXPECTED_PACKAGE"
          test "$ACTUAL_VERSION_CODE" = "$EXPECTED_VERSION_CODE"
          test "$ACTUAL_VERSION_NAME" = "$EXPECTED_VERSION_NAME"
          ACTUAL_CERT="$($APKSIGNER verify --verbose --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_CERT="$(printf '%s' "$CLIENT_SSH_RELEASE_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"
          mkdir -p signed-artifact
          cp "$APK" signed-artifact/Client-SSH-0.3.6-v43.apk
          printf 'package=%s\nversionCode=%s\nversionName=%s\n' "$ACTUAL_PACKAGE" "$ACTUAL_VERSION_CODE" "$ACTUAL_VERSION_NAME" > signed-artifact/APK_METADATA.txt
          printf '%s\n' "$ACTUAL_CERT" > signed-artifact/CERTIFICATE_SHA256.txt
          printf '%s\n' "$GITHUB_SHA" > signed-artifact/SOURCE_COMMIT.txt
          sha256sum signed-artifact/Client-SSH-0.3.6-v43.apk | tee signed-artifact/SHA256SUMS.txt

      - name: Upload signed test APK
        uses: actions/upload-artifact@v4
        with:
          name: client-ssh-0.3.6-simplified-monitor-v43
          path: signed-artifact
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f app/signing/client-ssh-release.jks
          rm -f "${RUNNER_TEMP}/client-ssh-release-storepass"

      - name: Report guarded run to PR
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK_SHA="$(cut -d' ' -f1 signed-artifact/SHA256SUMS.txt)"
          CERT_SHA="$(tr -d '\r\n' < signed-artifact/CERTIFICATE_SHA256.txt)"
          BODY=$(cat <<EOF
          ## Podpisany test uproszczonego Monitora v43 — PASS

          - run_id: \`${GITHUB_RUN_ID}\`
          - source: \`${GITHUB_SHA}\`
          - package: \`${EXPECTED_PACKAGE}\`
          - version: \`${EXPECTED_VERSION_NAME}\` / \`${EXPECTED_VERSION_CODE}\`
          - APK SHA-256: \`${APK_SHA}\`
          - cert SHA-256: \`${CERT_SHA}\`
          - artifact: \`client-ssh-0.3.6-simplified-monitor-v43\`
          - JKS usunięty z runnera: PASS
          EOF
          )
          gh api --method POST \
            repos/llipinsk82-rgb/client-ssh/issues/31/comments \
            -f body="$BODY" >/dev/null
