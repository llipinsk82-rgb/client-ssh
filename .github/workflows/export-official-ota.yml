name: Export official OTA v0.3.7

on:
  pull_request:
    paths:
      - "docs/ota-export-request.txt"

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;36.0.0"

      - name: Download official GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p exported
          gh release download v0.3.7 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "client-ssh-0.3.7.apk" \
            --pattern "client-ssh-0.3.7.apk.sha256" \
            --dir exported
          test -s exported/client-ssh-0.3.7.apk
          test -s exported/client-ssh-0.3.7.apk.sha256

      - name: Verify SHA-256, package, version and certificate
        shell: bash
        run: |
          set -euo pipefail
          cd exported

          EXPECTED_SHA="$(awk 'NF { print tolower($1); exit }' client-ssh-0.3.7.apk.sha256)"
          ACTUAL_SHA="$(sha256sum client-ssh-0.3.7.apk | awk '{ print tolower($1) }')"
          test -n "$EXPECTED_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          BADGING="$($AAPT dump badging client-ssh-0.3.7.apk | head -n 1)"
          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.* versionCode='\([^']*\)'.*/\1/p")"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.* versionName='\([^']*\)'.*/\1/p")"
          test "$PACKAGE" = "eu.blackserv.clientssh"
          test "$VERSION_CODE" = "50"
          test "$VERSION_NAME" = "0.3.7"

          CERT="$($APKSIGNER verify --verbose --print-certs client-ssh-0.3.7.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test -n "$CERT"
          printf '%s\n' "$CERT" > CERTIFICATE_SHA256.txt
          printf 'package=%s\nversionCode=%s\nversionName=%s\n' "$PACKAGE" "$VERSION_CODE" "$VERSION_NAME" > APK_METADATA.txt
          printf '%s  %s\n' "$ACTUAL_SHA" "client-ssh-0.3.7.apk" > VERIFIED_SHA256SUMS.txt

      - name: Upload verified official OTA package
        uses: actions/upload-artifact@v4
        with:
          name: client-ssh-official-0.3.7
          path: |
            exported/client-ssh-0.3.7.apk
            exported/client-ssh-0.3.7.apk.sha256
            exported/VERIFIED_SHA256SUMS.txt
            exported/APK_METADATA.txt
            exported/CERTIFICATE_SHA256.txt
          if-no-files-found: error
          retention-days: 7
