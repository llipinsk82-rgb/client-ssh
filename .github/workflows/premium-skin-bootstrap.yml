name: Premium visual skin bootstrap

on:
  push:
    branches:
      - agent/0.3.7-premium-visual-skin

permissions:
  contents: write

concurrency:
  group: premium-visual-skin-bootstrap
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[premium-skin-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out exact premium branch
        uses: actions/checkout@v4
        with:
          ref: agent/0.3.7-premium-visual-skin
          fetch-depth: 0

      - name: Reconstruct audited premium patcher
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/apply-premium-skin.py.gz.b64 <<'PATCH_B64'

PATCH_B64
          base64 --decode /tmp/apply-premium-skin.py.gz.b64 | gzip --decompress > /tmp/apply-premium-skin.py
          test "$(sha256sum /tmp/apply-premium-skin.py | awk '{print $1}')" = "b150737b4b3c99fd249f58e04d99832c1d042d2971d7480ac6d682b01c2d46fe"
          python3 -m py_compile /tmp/apply-premium-skin.py

      - name: Apply full premium visual system
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/apply-premium-skin.py scripts/apply-premium-skin.py
          python3 scripts/apply-premium-skin.py
          rm -f scripts/apply-premium-skin.py
          git diff --check
          grep -q 'BlackServ Premium' app/src/main/java/eu/blackserv/clientssh/model/Models.kt
          grep -q 'PremiumDeviceScene' app/src/main/java/eu/blackserv/clientssh/ui/screens/StartupScreen.kt
          grep -q 'Premium visual skin applied successfully' /tmp/apply-premium-skin.py

      - name: Reject committed signing secrets
        shell: bash
        run: bash scripts/check-no-release-secrets.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest --stacktrace --console=plain

      - name: Build premium debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --console=plain
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload premium debug APK
        uses: actions/upload-artifact@v4
        with:
          name: client-ssh-premium-visual-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Commit validated premium skin
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main
          git diff --cached --check
          git commit -m "Add premium 4K-ready visual skin [premium-skin-applied]"
          git push origin HEAD:agent/0.3.7-premium-visual-skin

      - name: Remove temporary patch material
        if: always()
        run: rm -f /tmp/apply-premium-skin.py /tmp/apply-premium-skin.py.gz.b64
