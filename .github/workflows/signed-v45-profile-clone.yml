name: Signed v45 profile clone verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  signed-v45:
    if: >-
      github.event.pull_request.number == 31 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/0.3.6-host-key-verification'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Guard exact v45 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)/\1/p' app/build.gradle.kts | head -n 1)" = "45"
          test "$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)" = "0.3.6"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Check release signing secrets
        shell: bash
        env:
          CLIENT_SSH_RELEASE_KEYSTORE_B64: ${{ secrets.CLIENT_SSH_RELEASE_KEYSTORE_B64 }}
          CLIENT_SSH_RELEASE_STORE_PASSWORD: ${{ secrets.CLIENT_SSH_RELEASE_STORE_PASSWORD }}
          CLIENT_SSH_RELEASE_KEY_ALIAS: ${{ secrets.CLIENT_SSH_RELEASE_KEY_ALIAS }}
          CLIENT_SSH_RELEASE_KEY_PASSWORD: ${{ secrets.CLIENT_SSH_RELEASE_KEY_PASSWORD }}
          CLIENT_SSH_RELEASE_CERT_SHA256: ${{ secrets.CLIENT_SSH_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$CLIENT_SSH_RELEASE_KEYSTORE_B64"
          test -n "$CLIENT_SSH_RELEASE_STORE_PASSWORD"
          test -n "$CLIENT_SSH_RELEASE_KEY_ALIAS"
          test -n "$CLIENT_SSH_RELEASE_KEY_PASSWORD"
          test -n "$CLIENT_SSH_RELEASE_CERT_SHA256"

      - name: Restore and verify signing key
        shell: bash
        env:
          CLIENT_SSH_RELEASE_KEYSTORE_B64: ${{ secrets.CLIENT_SSH_RELEASE_KEYSTORE_B64 }}
          CLIENT_SSH_RELEASE_STORE_PASSWORD: ${{ secrets.CLIENT_SSH_RELEASE_STORE_PASSWORD }}
          CLIENT_SSH_RELEASE_KEY_ALIAS: ${{ secrets.CLIENT_SSH_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p app/signing
          printf '%s' "$CLIENT_SSH_RELEASE_KEYSTORE_B64" | base64 --decode > app/signing/client-ssh-release.jks
          chmod 600 app/signing/client-ssh-release.jks
          STOREPASS_FILE="${RUNNER_TEMP}/client-ssh-release-storepass"
          printf '%s\n' "$CLIENT_SSH_RELEASE_STORE_PASSWORD" > "$STOREPASS_FILE"
          chmod 600 "$STOREPASS_FILE"
          keytool -list \
            -keystore app/signing/client-ssh-release.jks \
            -storepass:file "$STOREPASS_FILE" \
            -alias "$CLIENT_SSH_RELEASE_KEY_ALIAS" >/dev/null

      - name: Run unit tests
        shell: bash
        run: gradle :app:testDebugUnitTest --stacktrace --console=plain

      - name: Build signed release APK
        shell: bash
        env:
          CLIENT_SSH_RELEASE_STORE_PASSWORD: ${{ secrets.CLIENT_SSH_RELEASE_STORE_PASSWORD }}
          CLIENT_SSH_RELEASE_KEY_ALIAS: ${{ secrets.CLIENT_SSH_RELEASE_KEY_ALIAS }}
          CLIENT_SSH_RELEASE_KEY_PASSWORD: ${{ secrets.CLIENT_SSH_RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace --console=plain

      - name: Verify APK metadata and certificate
        shell: bash
        env:
          CLIENT_SSH_RELEASE_CERT_SHA256: ${{ secrets.CLIENT_SSH_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          BADGING="$($AAPT dump badging "$APK" | head -n 1)"
          ACTUAL_PACKAGE="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          ACTUAL_VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.* versionCode='\([^']*\)'.*/\1/p")"
          ACTUAL_VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.* versionName='\([^']*\)'.*/\1/p")"
          test "$ACTUAL_PACKAGE" = "eu.blackserv.clientssh"
          test "$ACTUAL_VERSION_CODE" = "45"
          test "$ACTUAL_VERSION_NAME" = "0.3.6"
          ACTUAL_CERT="$($APKSIGNER verify --verbose --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_CERT="$(printf '%s' "$CLIENT_SSH_RELEASE_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"
          mkdir -p signed-artifact
          cp "$APK" signed-artifact/Client-SSH-0.3.6-v45.apk
          printf 'package=%s\nversionCode=%s\nversionName=%s\nsource=%s\n' "$ACTUAL_PACKAGE" "$ACTUAL_VERSION_CODE" "$ACTUAL_VERSION_NAME" "$SOURCE_SHA" > signed-artifact/APK_METADATA.txt
          printf '%s\n' "$ACTUAL_CERT" > signed-artifact/CERTIFICATE_SHA256.txt
          sha256sum signed-artifact/Client-SSH-0.3.6-v45.apk | tee signed-artifact/SHA256SUMS.txt

      - name: Upload signed v45 APK
        uses: actions/upload-artifact@v4
        with:
          name: client-ssh-0.3.6-profile-clone-v45
          path: signed-artifact
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f app/signing/client-ssh-release.jks
          rm -f "${RUNNER_TEMP}/client-ssh-release-storepass"
          test ! -e app/signing/client-ssh-release.jks
