name: Temporary telemetry diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  test-log:
    if: github.event.pull_request.number == 29
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Run tests and retain full log
        id: tests
        shell: bash
        run: |
          set +e
          gradle :app:testDebugUnitTest --stacktrace --console=plain > telemetry-test.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-test-log
          path: telemetry-test.log
          if-no-files-found: error
          retention-days: 1
      - name: Preserve test result
        if: always()
        shell: bash
        run: exit "${{ steps.tests.outputs.status }}"
